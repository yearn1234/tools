<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>重新導向中…</title>
  <meta http-equiv="refresh" content="0; url=https://tymetro-web.github.io/tools/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --accent: #58a6ff;
      --muted: #8b949e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #21262d;
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
      word-break: break-all;
    }
    a:hover { border-bottom-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>正在重新導向…</h1>
    <p>如果頁面沒有自動跳轉，請點擊下方連結。</p>
    <a href="https://tymetro-web.github.io/tools/">https://tymetro-web.github.io/tools/</a>
  </main>
  <script>
    location.replace("https://tymetro-web.github.io/tools/");
  </script>
</body>
</html>
